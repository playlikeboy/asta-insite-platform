packages:
  - 'apps/*'
  - 'packages/*'
# pnpm added these exclusions because the releases were newer than its minimum release age.
# Remove them once a later install no longer needs them.
minimumReleaseAgeExclude:
  - '@next/env@16.4.4'
  - '@next/eslint-plugin-next@16.4.4'
  - '@next/swc-darwin-arm64@16.4.4'
  - '@next/swc-darwin-x64@16.4.4'
  - '@next/swc-linux-arm64-gnu@16.4.4'
  - '@next/swc-linux-arm64-musl@16.4.4'
  - '@next/swc-linux-x64-gnu@16.4.4'
  - '@next/swc-linux-x64-musl@16.4.4'
  - '@next/swc-win32-arm64-msvc@16.4.4'
  - '@next/swc-win32-x64-msvc@16.4.4'
  - eslint-config-next@16.4.4
  - next@16.4.4

# pnpm blocks install scripts by default. esbuild needs its script for drizzle-kit and vitest.
allowBuilds:
  esbuild: true
